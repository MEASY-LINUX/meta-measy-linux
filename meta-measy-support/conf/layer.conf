BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "measy-support"
BBFILE_PATTERN_measy-support = "^${LAYERDIR}/"
BBFILE_PRIORITY_measy-support = "6"

LAYERVERSION_measy-support = "1"
LAYERSERIES_COMPAT_measy-support = "wrynose"
LAYERDEPENDS_measy-support = "core"

# Machine features are not overrides by default. Promote measy-amp only when a
# machine explicitly enables it, so AMP appends remain opt-in.
MACHINEOVERRIDES:append = "${@bb.utils.contains('MACHINE_FEATURES', 'measy-amp', ':measy-amp', '', d)}"

require conf/distro/include/measy-rt.inc
