# Keep the layer in BBLAYERS for both OTA and non-OTA builds. Product
# configurations opt in with OTA_SUPPORT = "1".
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "measy-swupdate"
BBFILE_PATTERN_measy-swupdate = "^${LAYERDIR}/"
BBFILE_PRIORITY_measy-swupdate = "7"

LAYERVERSION_measy-swupdate = "1"
LAYERDEPENDS_measy-swupdate = "core openembedded-layer swupdate"
LAYERSERIES_COMPAT_measy-swupdate = "wrynose"

OTA_SUPPORT ??= "0"
